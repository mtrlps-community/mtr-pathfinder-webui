<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTR Pathfinder WebUI</title>
    <!-- 网页标题栏图标 -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    
    <!-- 内联脚本：立即应用主题，直接设置CSS变量 -->
    <script>
        // 立即执行，不依赖任何事件
        (function() {
            const root = document.documentElement;
            const body = document.body;
            
            // 主题配置
            const lightTheme = {
                '--bg-primary': '#f3f4f6',
                '--bg-secondary': '#ffffff',
                '--bg-tertiary': '#e5e7eb',
                '--text-primary': '#111827',
                '--text-secondary': '#4b5563',
                '--text-tertiary': '#6b7280',
                '--border-color': '#d1d5db',
                '--hover-bg': '#dbeafe',
                '--active-bg': '#3b82f6',
                '--active-text': '#ffffff',
                '--card-bg': '#ffffff',
                '--card-shadow': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)',
                '--btn-primary-bg': '#3b82f6',
                '--btn-primary-hover': '#2563eb',
                '--btn-secondary-bg': '#e5e7eb',
                '--btn-secondary-hover': '#d1d5db',
                '--btn-secondary-text': '#4b5563',
                '--form-input-bg': '#ffffff',
                '--form-input-border': '#d1d5db',
                '--form-input-focus': '#3b82f6',
                '--algorithm-tab-bg': '#e5e7eb',
                '--algorithm-tab-hover': '#d1d5db',
                '--algorithm-tab-text': '#6b7280',
                '--result-item-border': '#e5e7eb',
                '--station-node-bg': '#ffffff',
                '--station-node-border': '#9ca3af',
                '--error-bg': '#fee2e2',
                '--error-border': '#fecaca',
                '--error-text': '#dc2626',
                '--success-bg': '#d1fae5',
                '--success-border': '#a7f3d0',
                '--success-text': '#065f46',
                '--accent-bg': '#dbeafe',
                '--accent-primary': '#3b82f6'
            };
            
            const darkTheme = {
                '--bg-primary': '#111827',
                '--bg-secondary': '#1f2937',
                '--bg-tertiary': '#374151',
                '--text-primary': '#f9fafb',
                '--text-secondary': '#d1d5db',
                '--text-tertiary': '#9ca3af',
                '--border-color': '#374151',
                '--hover-bg': '#4b5563',
                '--active-bg': '#3b82f6',
                '--active-text': '#ffffff',
                '--card-bg': '#1f2937',
                '--card-shadow': '0 1px 3px 0 rgba(0, 0, 0, 0.3), 0 1px 2px 0 rgba(0, 0, 0, 0.2)',
                '--btn-primary-bg': '#3b82f6',
                '--btn-primary-hover': '#2563eb',
                '--btn-secondary-bg': '#374151',
                '--btn-secondary-hover': '#4b5563',
                '--btn-secondary-text': '#d1d5db',
                '--form-input-bg': '#374151',
                '--form-input-border': '#4b5563',
                '--form-input-focus': '#3b82f6',
                '--algorithm-tab-bg': '#374151',
                '--algorithm-tab-hover': '#4b5563',
                '--algorithm-tab-text': '#d1d5db',
                '--result-item-border': '#374151',
                '--station-node-bg': '#1f2937',
                '--station-node-border': '#6b7280',
                '--error-bg': '#370617',
                '--error-border': '#991b1b',
                '--error-text': '#fca5a5',
                '--success-bg': '#064e3b',
                '--success-border': '#047857',
                '--success-text': '#a7f3d0',
                '--accent-bg': '#1e3a8a',
                '--accent-primary': '#93c5fd'
            };
            
            // 主题状态：light, dark, auto
            let currentTheme = localStorage.getItem('theme') || 'light';
            
            // 获取系统主题媒体查询
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            
            // 直接设置CSS变量
            function setCSSVariables(theme) {
                for (const [key, value] of Object.entries(theme)) {
                    root.style.setProperty(key, value);
                }
            }
            
            // 应用主题
            function applyTheme() {
                let theme = lightTheme;
                
                if (currentTheme === 'auto') {
                    // 自动模式：根据系统主题
                    theme = mediaQuery.matches ? darkTheme : lightTheme;
                } else if (currentTheme === 'dark') {
                    // 深色模式
                    theme = darkTheme;
                } else {
                    // 浅色模式
                    theme = lightTheme;
                }
                
                // 直接设置CSS变量
                setCSSVariables(theme);
            }
            
            // 立即应用主题
            applyTheme();
            
            // 系统主题变化监听函数
            function handleSystemThemeChange(e) {
                // 只有在自动模式下，才跟随系统主题变化
                if (currentTheme === 'auto') {
                    setCSSVariables(e.matches ? darkTheme : lightTheme);
                }
            }
            
            // 添加系统主题变化监听器
            mediaQuery.addEventListener('change', handleSystemThemeChange);
            
            // 保存主题偏好
            window.saveTheme = function(theme) {
                currentTheme = theme;
                localStorage.setItem('theme', theme);
                applyTheme();
            };
        })();
    </script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome v7 from npmmirror -->
    <link href="https://registry.npmmirror.com/@fortawesome/fontawesome-free/7.2.0/files/css/all.min.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
    <!-- Umami Analytics -->
    {% if config.UMAMI_SCRIPT_URL and config.UMAMI_WEBSITE_ID %}
    <script defer src="{{ config.UMAMI_SCRIPT_URL }}" data-website-id="{{ config.UMAMI_WEBSITE_ID }}"></script>
    {% endif %}

</head>
<body class="bg-gray-100 min-h-screen m-0 p-0" style="background-color: var(--bg-primary);">
    <!-- 导航栏 -->
    <nav class="bg-white dark:bg-gray-800 shadow-md" style="position: relative; background-color: var(--bg-secondary);">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <!-- 标题区域 -->
                <div class="flex items-center space-x-2" id="title-container" style="cursor: pointer;">
                    <i class="fa-solid fa-train text-blue-500 text-xl"></i>
                    <h1 class="text-xl font-bold" style="color: var(--text-primary);">MTR Pathfinder</h1>
                </div>
                
                <!-- 深色模式切换按钮 - 紧挨标题但不进入标题div -->
                <button id="theme-toggle" class="text-gray-600 hover:text-gray-800 focus:outline-none" style="color: var(--text-secondary);">
                    <i class="fa-solid text-lg fa-moon"></i>
                </button>
            </div>
            
            <div class="flex items-center space-x-4">
                <!-- 汉堡菜单按钮 -->
                <button class="mobile-menu-button focus:outline-none" style="color: var(--text-secondary);">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                
                <!-- 导航链接 -->
                <div class="nav-links">
                    <a href="/" class="nav-item {{ 'active' if request.path == '/' else '' }}">
                        <i class="fa-solid fa-search mr-1"></i> 寻路
                    </a>
                    <a href="/timetable" class="nav-item {{ 'active' if request.path == '/timetable' else '' }}">
                        <i class="fa-regular fa-clock mr-1"></i> 时刻表
                    </a>
                    <a href="/stations" class="nav-item {{ 'active' if request.path == '/stations' else '' }}">
                        <i class="fa-solid fa-map-marker-alt mr-1"></i> 车站列表
                    </a>
                    <a href="/routes" class="nav-item {{ 'active' if request.path == '/routes' else '' }}">
                        <i class="fa-solid fa-train mr-1"></i> 线路列表
                    </a>
                    <a href="/admin" class="nav-item {{ 'active' if request.path == '/admin' else '' }}">
                        <i class="fa-solid fa-gear mr-1"></i> 控制台
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main class="container mx-auto px-4 py-6">
        {% block content %}
        {% endblock %}
    </main>

    <!-- 页脚 -->
    

    {% block scripts %}
    {% endblock %}
<script>
        // 自适应调整textarea高度 - 简化版本
        window.autoResizeTextarea = function(textarea) {
            // 确保textarea元素存在
            if (!textarea || !textarea.classList.contains('form-input')) return;
            
            // 获取计算样式
            const computedStyle = getComputedStyle(textarea);
            const lineHeight = parseInt(computedStyle.lineHeight);
            const paddingTop = parseInt(computedStyle.paddingTop);
            const paddingBottom = parseInt(computedStyle.paddingBottom);
            
            // 计算一行的实际高度（包括内边距）
            const singleLineHeight = lineHeight + paddingTop + paddingBottom;
            
            // 重置高度以获得准确的scrollHeight
            textarea.style.height = `${singleLineHeight}px`;
            
            // 计算新高度，确保至少为一行
            const newHeight = Math.max(textarea.scrollHeight, singleLineHeight);
            
            // 只在高度变化时更新，避免不必要的重绘
            if (textarea.style.height !== `${newHeight}px`) {
                textarea.style.height = `${newHeight}px`;
            }
        }
        
        // 批量处理所有textarea
        function processAllTextareas() {
            const textareas = document.querySelectorAll('.form-input');
            textareas.forEach(textarea => {
                autoResizeTextarea(textarea);
            });
        }
        
        // 页面加载完成后初始化所有textarea
        document.addEventListener('DOMContentLoaded', function() {
            // 初始加载时调整高度
            processAllTextareas();
            
            // 只监听必要的事件，避免性能问题
            document.addEventListener('input', function(e) {
                if (e.target && e.target.classList.contains('form-input')) {
                    autoResizeTextarea(e.target);
                }
            });
            
            // 监听paste和cut事件
        document.addEventListener('paste', function(e) {
            if (e.target && e.target.classList.contains('form-input')) {
                setTimeout(() => autoResizeTextarea(e.target), 0);
            }
        });
        
        document.addEventListener('cut', function(e) {
            if (e.target && e.target.classList.contains('form-input')) {
                setTimeout(() => autoResizeTextarea(e.target), 0);
            }
        });
        
        // 监听enter键，直接提交表单
        document.addEventListener('keydown', function(e) {
            if (e.target && e.target.classList.contains('form-input') && e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const form = document.getElementById('route-form');
                if (form) {
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });
    });
    
    // 当页面完全加载（包括图片等资源）后再次调整高度
    window.addEventListener('load', function() {
        processAllTextareas();
    });
    
    // 主题切换功能 - 处理主题切换和UI交互
    (function() {
        // 主题状态：light, dark, auto
        let currentTheme = localStorage.getItem('theme') || 'light';
        
        // 获取系统主题媒体查询
        const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
        
        // 等DOM加载完成后，初始化主题切换按钮和移动端菜单
        document.addEventListener('DOMContentLoaded', function() {
            // 移动端菜单功能
            const mobileMenuButton = document.querySelector('.mobile-menu-button');
            const navLinks = document.querySelector('.nav-links');
            
            if (mobileMenuButton && navLinks) {
                mobileMenuButton.addEventListener('click', function() {
                    navLinks.classList.toggle('show');
                });
            }
            
            // 标题点击回到主界面功能
            const titleContainer = document.getElementById('title-container');
            if (titleContainer) {
                titleContainer.addEventListener('click', function() {
                    window.location.href = '/';
                });
            }
            
            // 初始化主题切换按钮
            const themeToggle = document.getElementById('theme-toggle');
            
            // 更新主题显示（包括图标）
            function updateIcon() {
                if (themeToggle) {
                    const icon = themeToggle.querySelector('i');
                    icon.classList.remove('fa-moon', 'fa-sun', 'fa-circle-half-stroke');
                    
                    if (currentTheme === 'auto') {
                        icon.classList.add('fa-circle-half-stroke');
                    } else if (currentTheme === 'dark') {
                        icon.classList.add('fa-sun');
                    } else {
                        icon.classList.add('fa-moon');
                    }
                }
            }
            
            // 主题切换按钮点击事件
            if (themeToggle) {
                themeToggle.addEventListener('click', function() {
                    // 循环切换主题：light → dark → auto → light
                    switch (currentTheme) {
                        case 'light':
                            currentTheme = 'dark';
                            break;
                        case 'dark':
                            currentTheme = 'auto';
                            break;
                        case 'auto':
                            currentTheme = 'light';
                            break;
                        default:
                            currentTheme = 'light';
                    }
                    
                    // 使用全局函数保存主题并应用
                    window.saveTheme(currentTheme);
                    
                    // 更新图标
                    updateIcon();
                });
                
                // 初始化图标
                updateIcon();
            }
        });
    })();
    </script>
    </body>
</html>
